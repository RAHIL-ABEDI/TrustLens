[tool.poetry]
name = "trustlens"
version = "0.1.0"
description = "TrustLens — Multi-Source Digital Trust Investigator"
authors = ["RAHIL-ABEDI <example@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0.0"
langgraph = ">=1.2"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
httpx = ">=0.28"
google-genai = ">=1.0"
streamlit = ">=1.30"
python-dotenv = ">=1.0"
langchain-core = ">=0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
