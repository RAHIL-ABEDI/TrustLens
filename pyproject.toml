[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustlens"
version = "0.1.0"
description = "TrustLens — Multi-Source Digital Trust Investigator"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "google-genai>=1.0",
    "streamlit>=1.30",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
